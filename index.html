<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Image Encryption Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-gradient">
        <h1>Image Encryption Tool</h1>
        <p class="subtitle">Encrypt and decrypt your images with simple pixel operations. Try it out below!</p>
    </div>
    <div class="container card">
        <form id="mainForm" autocomplete="off" onsubmit="return false;">
            <label for="imageInput" class="file-label" aria-label="Upload image">
                <span id="fileLabelText">Choose an image</span>
                <input type="file" id="imageInput" accept="image/*" style="display:none;">
            </label>
            <div class="operations">
                <label><input type="radio" name="operation" value="swap" checked> Swap Pixels (Reverse)</label>
                <label><input type="radio" name="operation" value="add"> Add Value to Pixels</label>
                <label><input type="radio" name="operation" value="multiply"> Multiply Pixels</label>
            </div>
            <div id="paramInput" style="display:none;">
                <label for="paramValue">Value: </label>
                <input type="number" id="paramValue" value="10">
            </div>
            <div class="buttons">
                <button id="encryptBtn" type="button">Encrypt</button>
                <button id="decryptBtn" type="button">Decrypt</button>
                <button id="downloadBtn" type="button" disabled>Download</button>
                <button id="resetBtn" type="button">Reset</button>
            </div>
        </form>
        <div class="previews">
            <div>
                <h3>Original Image</h3>
                <canvas id="originalCanvas"></canvas>
            </div>
            <div>
                <h3>Encrypted Image</h3>
                <canvas id="encryptedCanvas"></canvas>
            </div>
            <div>
                <h3>Decrypted Image</h3>
                <canvas id="decryptedCanvas"></canvas>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
